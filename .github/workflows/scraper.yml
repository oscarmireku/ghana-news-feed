name: News Scraper

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes (reduced from 10 for reliability)
  repository_dispatch:
    types: [trigger-scrape]
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

# Prevent concurrent runs - cancel old jobs when new one starts
concurrency:
  group: news-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Increased from 15 for better reliability
    
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx src/scripts/scrape-standalone.ts
